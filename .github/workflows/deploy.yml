name: Deploy to production

# Выкат на 45.131.40.65 (nginx + https://sota-forms.im-iaa.ru).
#
# Схема на хосте нестандартная, и деплой обязан ей соответствовать:
# фронт там НЕ сервис, а разовая build-job — nginx отдаёт статику из
# frontend/dist, а `docker compose up` фронт пропускает (profiles: ["build"]
# в server-local docker-compose.override.yml). Поэтому одного `up --build`
# мало: без ./rebuild-frontend.sh деплой выкатывает новый бэкенд со старым
# интерфейсом — молча и с зелёной галочкой.

on:
  push:
    branches: [main]
  # Чтобы перевыкатить без пустого коммита (например, после правки секретов).
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy sota-forms
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты заданы
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Без этой проверки ssh-action падает с «error: missing server host» —
          # по такому сообщению не догадаться, что дело в незаполненных секретах.
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ]  || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing — Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          # Сборка фронта на этой VPS занимает под минуту, бэкенда — больше;
          # дефолтных 10m хватает впритык, а обрыв на середине сборки хуже ожидания.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/sota-forms

            echo "==> обновляем код"
            git pull origin main

            # Без `down`: статику отдаёт nginx и она не зависит от контейнеров,
            # а API простаивает только на время пересоздания контейнера, а не всю
            # сборку. Прежний `down` + `up --build` клал бэкенд на несколько минут.
            echo "==> пересобираем бэкенд и воркер"
            docker compose up -d --build

            echo "==> пересобираем фронт и подменяем бандл"
            ./rebuild-frontend.sh

            # Зелёная галочка не должна означать «контейнер упал сразу после старта».
            echo "==> ждём здоровья бэкенда"
            ok=""
            for _ in $(seq 1 30); do
              if curl -sf localhost:8000/api/health >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "!! бэкенд не отвечает на /api/health — деплой считается неуспешным"
              docker compose logs --tail=80 backend
              exit 1
            fi

            docker compose ps
            echo "==> готово @ $(date +'%F %T')"
