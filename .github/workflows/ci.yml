name: GRACE pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  # Ручной перезапуск всего пайплайна (включая выкат), когда код не менялся —
  # например, после правки секретов.
  workflow_dispatch:

jobs:
  backend:
    name: Backend · light + infra tiers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forms
          POSTGRES_PASSWORD: forms
          POSTGRES_DB: forms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://forms:forms@localhost:5432/forms_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Static gate (ruff)
        run: ruff check .
      - name: Type gate (mypy)
        run: mypy app/formula.py app/crypto.py || true  # advisory
      - name: Property + infra tiers (pytest, real Postgres)
        run: pytest -q
        # "не запустилось — значит не прошло": honest-NA tests would SKIP if the
        # DB were unreachable; here the service container guarantees a real DB.

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Type gate
        run: npm run typecheck
      - name: Build app
        run: npm run build
      - name: Build embeddable widget bundle
        run: npm run build:widget

  deploy:
    name: Выкат на прод
    # Выкат — последний шаг ТОГО ЖЕ пайплайна, а не отдельный workflow. Раньше
    # deploy.yml запускался параллельно с тестами (оба прогона стартовали в одну
    # секунду), то есть красный pytest не мешал коду уехать на прод. Теперь job
    # физически не стартует, пока оба гейта не зелёные.
    #
    # Через workflow_run это связать нельзя: такой триггер GitHub читает из
    # ВЕТКИ ПО УМОЛЧАНИЮ, а она здесь не main — деплой молча не запускался бы.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты заданы
        id: secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Незаданные секреты — это «выкатываем руками», а не авария: падать
          # красным на каждый коммит из-за осознанной схемы незачем.
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ]  || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Автодеплой пропущен — не заданы секреты:$missing (Settings → Secrets and variables → Actions). Выкат руками: ./scripts/deploy.sh"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          # Сборка фронта и бэкенда на этой VPS занимает несколько минут;
          # дефолтных 10m впритык, а обрыв на середине сборки хуже ожидания.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/sota-forms

            # Код тянем здесь, а не внутри скрипта: самого scripts/deploy.sh на
            # хосте может ещё не быть — он приезжает этим же pull'ом.
            git pull origin main

            # Вся последовательность выката живёт в репозитории, в одном месте:
            # и человек, и CI запускают буквально один и тот же скрипт, поэтому
            # ручной и автоматический выкат не могут разъехаться.
            ./scripts/deploy.sh --skip-pull
