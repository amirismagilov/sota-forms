name: GRACE pipeline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend · light + infra tiers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forms
          POSTGRES_PASSWORD: forms
          POSTGRES_DB: forms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://forms:forms@localhost:5432/forms_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Static gate (ruff)
        run: ruff check .
      - name: Type gate (mypy)
        run: mypy app/formula.py app/crypto.py || true  # advisory
      - name: Property + infra tiers (pytest, real Postgres)
        run: pytest -q
        # "не запустилось — значит не прошло": honest-NA tests would SKIP if the
        # DB were unreachable; here the service container guarantees a real DB.

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Type gate
        run: npm run typecheck
      - name: Build app
        run: npm run build
      - name: Build embeddable widget bundle
        run: npm run build:widget
